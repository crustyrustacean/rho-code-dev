<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}{{ site.name }}{% endblock %}</title>
        <link rel="icon" type="image/png" href="/static/favicon.png">
        <link rel="stylesheet" href="/css/main.css">
    </head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>{{ site.name }}</h1>
                    <span class="tagline">coding agent</span>
                </div>
                <nav class="main-nav">
                    <a href="https://crustyrustacean.github.io/rho-coding-agent" target="_blank" class="nav-link">Documentation</a>
                    <a href="https://github.com/crustyrustacean/rho-coding-agent#installation" target="_blank" class="nav-link cta">Get Started</a>
                </nav>
            </div>
        </div>
    </header>
    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer>
        <p>&copy; {{ now.year }} {{ site.name }}</p>
    </footer>
    <!-- General interactivity via plain JavaScript -->
    <script src="/static/scripts.js"></script>
</body>
</html>
